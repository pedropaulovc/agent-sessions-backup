[project]
name = "agent-collector"
# Derived from agent_collector.__version__ — the SAME string the heartbeat reports (run.py sends
# `collector_version: __version__`). Two hand-maintained version strings would let a release bump one
# and not the other, so the fleet would report a version the hub never expects and page as outdated.
dynamic = ["version"]
description = "Per-machine collector: incremental session-file uploads, heartbeats, web capture"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Only the webcapture host needs a websocket client; the base collector stays dependency-free.
webcapture = ["websocket-client>=1.7"]

[project.scripts]
agent-collector = "agent_collector.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.version]
path = "src/agent_collector/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_collector"]
