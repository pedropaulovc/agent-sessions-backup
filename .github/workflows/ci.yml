name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # A workflow expression error is not a test failure — GitHub rejects the file at VALIDATION time
  # and the run produces ZERO jobs, so every other check silently never runs. `yaml.safe_load` does
  # not catch it (the YAML is fine; the Actions expression is not). actionlint does, and would have
  # caught the `secrets`-in-`if:` that took this whole workflow down on 152d7f1.
  #
  # This job cannot catch a fatal error in its own file for the same reason it exists — validation
  # precedes job scheduling. Run `actionlint .github/workflows/*.yml` locally before pushing
  # workflow edits; this covers the non-fatal expression/shell mistakes and any other workflow file.
  actions-lint:
    runs-on: ubuntu-latest
    steps:
      # No credentials left in .git/config: nothing here needs to push, and a job that does not
      # need a token should not be holding one where a compromised action could read it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest .
          ./actionlint -color

  hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --script ../infra/cf/test_enroll_cert.py
      - run: uv sync
      - run: uv run pytest

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest

  # Applies pending D1 migrations to the PREVIEW database with NO Cloudflare credential at all.
  #
  # This job used to hold a Cloudflare API token, which cannot be made safe here: D1 token
  # permissions are account-scoped (there is no per-database resource as there is for an R2
  # bucket), Cloudflare has no workload-identity federation, and a same-repo PR runs its OWN copy
  # of this file — so any token handed to a PR-triggered job can reach production D1.
  #
  # A Worker binding is the one construct in D1's model that genuinely cannot. The preview Worker's
  # DB binding is sessions-index-preview and it has no production binding, so this job calls that
  # Worker instead and authenticates with a short-lived GitHub OIDC assertion. A maximally hostile
  # PR — rewriting this file included — still reaches exactly one database, because that is all the
  # capability it is talking to can reach. Nothing here is secret: `id-token: write` mints a
  # per-run assertion, and the endpoint pins issuer, audience and repository.
  #
  # Gated on `hub` for the same reason `deploy` is: the test suite applies every migration, so a
  # broken one never reaches a real database. The preview D1 is shared by all branches, so an
  # unmerged branch's migration lands early — already true of every other preview resource.
  migrate-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: hub
    # `needs: hub` only orders jobs WITHIN one run, and the preview D1 is shared by every branch —
    # so two PRs opened around the same time can apply migrations to the same database
    # concurrently. A repo-wide group (not per-PR) makes them queue instead of race.
    #
    # KNOWN LIMIT, deliberately accepted: GitHub keeps at most ONE pending run per group. A third
    # overlapping run displaces the second, and the displaced one is CANCELLED, not queued behind
    # it. So with three PRs landing at once, one PR's migrations may not reach the preview
    # database on that push. That is tolerable here and a real queue is not worth building for it:
    # the outcome is a visibly cancelled check rather than a silent skip, the endpoint is
    # idempotent so that PR's next push applies the same set, and `migrate-preview-main` re-applies
    # everything once the branch merges. What the group DOES buy is the thing that actually
    # corrupts state — two runs writing the shared database at the same time, where the endpoint's
    # atomic name claim can order two runs applying the same migration but not two applying
    # different, dependent ones.
    concurrency:
      group: migrate-preview
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout token left in .git/config. This job holds a short-lived OIDC assertion and
      # never pushes, so a compromised action should find nothing reusable here.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Cloudflare's branch alias lowercases the branch and replaces non-alphanumerics with '-'
      # (infra/cf/deploy.md). If that normalisation ever diverges the request 404s, which the
      # non-fatal handling below reports as a notice rather than a red build.
      - id: target
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          alias=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | cut -c1-63)
          echo "url=https://${alias}-sessions-hub-preview.pedro-18e.workers.dev" >> "$GITHUB_OUTPUT"
      - name: Apply preview migrations
        env:
          TARGET: ${{ steps.target.outputs.url }}
        run: |
          set -uo pipefail
          oidc=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sessions-hub-preview-migrate" | jq -r .value)
          if [ -z "$oidc" ] || [ "$oidc" = "null" ]; then
            echo "::error::could not mint a GitHub OIDC token (is id-token: write set?)"
            exit 1
          fi
          python3 -c "
          import json, pathlib
          files = sorted(pathlib.Path('hub/migrations').glob('*.sql'))
          print(json.dumps({'migrations': [{'name': f.name, 'sql': f.read_text()} for f in files]}))
          " > /tmp/migrations.json
          # Workers Builds deploys the preview independently of this workflow, so on a brand-new
          # branch the endpoint may not be live yet. Retry briefly, then stop: an unmigrated preview
          # converges on the next push, and a red build here would just train people to ignore it.
          code=000
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/migrate-out.json -w '%{http_code}' \
              -X POST "$TARGET/api/v1/admin/migrate" \
              -H "Authorization: Bearer $oidc" -H 'content-type: application/json' \
              --data-binary @/tmp/migrations.json) || code=000
            if [ "$code" = "200" ]; then
              echo "::notice::preview migrations: $(cat /tmp/migrate-out.json)"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code $(cat /tmp/migrate-out.json 2>/dev/null || true)"
            sleep 15
          done
          echo "::notice::preview migration endpoint unreachable at $TARGET (HTTP $code) — preview may run an older schema until the next push."

  # Migrate D1 then deploy the hub Worker, in that order, on merge to main. This is the SOLE deployer:
  # Cloudflare Workers Builds auto-deploy is turned OFF so nothing races us. Applying migrations before
  # `wrangler deploy` guarantees new code never runs against the old schema — the failure mode that
  # fired the agent-backup-parse-errors alert on 2026-07-22 (PR #51's migration 0013 shipped but was
  # never applied, so every ingest threw `D1_ERROR: no such column`). Gated on the hub tests (which
  # apply every migration via applyD1Migrations) so a broken migration never reaches prod.
  # Requires repo secret CLOUDFLARE_API_TOKEN with, on this account: D1, Workers Scripts, Queues,
  # Workers R2 Storage, Workers KV Storage (Edit) + Account Settings (Read); and on the vza.net zone:
  # Workers Routes (Edit). account_id comes from wrangler.jsonc.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: hub
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npx wrangler d1 migrations apply sessions-index --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
