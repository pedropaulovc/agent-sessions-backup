name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for every job: checkout and the deploy job's current-main read only need
# contents: read. The preview job additionally grants pull-requests: write so it can publish
# the disposable preview's derived login code in the PR.
permissions:
  contents: read

jobs:
  # A workflow expression error is not a test failure — GitHub rejects the file at VALIDATION time
  # and the run produces ZERO jobs, so every other check silently never runs. `yaml.safe_load` does
  # not catch it (the YAML is fine; the Actions expression is not). actionlint does, and would have
  # caught the `secrets`-in-`if:` that took this whole workflow down on 152d7f1.
  #
  # This job cannot catch a fatal error in its own file for the same reason it exists — validation
  # precedes job scheduling. Run `actionlint .github/workflows/*.yml` locally before pushing
  # workflow edits; this covers the non-fatal expression/shell mistakes and any other workflow file.
  actions-lint:
    runs-on: ubuntu-latest
    steps:
      # No credentials left in .git/config: nothing here needs to push, and a job that does not
      # need a token should not be holding one where a compromised action could read it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest .
          ./actionlint -color

  hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - name: Verify migrations against protected base
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node scripts/migrations.mjs check --base-ref "$MIGRATION_BASE_REF"
          node scripts/migrations.mjs check --migrations-dir migrations-index --base-ref "$MIGRATION_BASE_REF"
      - run: npm run typecheck
      - run: npm test

  browser-e2e:
    name: Browser e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm --prefix hub ci
      - name: Install Chromium and Linux browser dependencies
        if: runner.os == 'Linux'
        run: npx --prefix hub playwright install --with-deps chromium
      - name: Install Chromium
        if: runner.os == 'Windows'
        run: npx --prefix hub playwright install chromium
      - run: npm --prefix hub run test:e2e
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ runner.os }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            hub/test-results/
            hub/playwright-report/

  collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --script ../infra/cf/test_enroll_cert.py
      - run: uv sync
      - run: uv run pytest

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest

  # Each PR builds, migrates, and deploys its own preview from its own checkout, in its own job.
  # There is no trust barrier to enforce and therefore no release handoff: the credential is
  # scoped to a throwaway non-production Cloudflare account whose entire contents are pr-N-*
  # resources, so any PR author can safely deploy their own branch. That removes the artifact,
  # provenance, and re-verification machinery a workflow_run controller needed.
  #
  # `environment:` IS the deployment record. GitHub opens the preview/pr-N deployment when this
  # job starts and closes it with this job's own conclusion, so the PR can never show a state the
  # workflow is not actually in — and because the job runs on the pull_request event, the run is
  # a check on the PR rather than an orphaned run attached to main.
  #
  # Fork PRs get no secrets from GitHub, so this job fails there rather than skipping: a preview
  # that silently does not exist is worse than one that says why.
  preview:
    if: github.event_name == 'pull_request'
    needs: hub
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: preview/pr-${{ github.event.number }}
      # The stable per-PR hostname from resourceNames() in infra/cf/preview-trust.mjs. Declared
      # statically so the card links somewhere from the first second, and because the preview is
      # deployed in place: on a failed run the link still reaches the previous good deploy.
      url: https://pr-${{ github.event.number }}-app.sessions-ppe.workers.dev
    concurrency:
      group: preview-pr-${{ github.event.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm --prefix hub ci
      - name: Install Chromium
        run: npx --prefix hub playwright install --with-deps chromium
      - name: Provision, migrate, and deploy the preview
        id: provision
        env:
          CLOUDFLARE_PPE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_PPE_ACCOUNT_ID }}
          CLOUDFLARE_PPE_API_TOKEN: ${{ secrets.CLOUDFLARE_PPE_API_TOKEN }}
          PREVIEW_BEARER_SEED: ${{ secrets.PREVIEW_BEARER_SEED }}
          # Bound as environment variables, never interpolated into the shell command: this job
          # holds credentials, so an expansion must stay inert data even if it ever came to carry
          # shell metacharacters.
          PR_NUMBER: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          node infra/cf/preview-control.mjs provision
          --repository "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER"
          --head-sha "$HEAD_SHA"
          --account-id "$CLOUDFLARE_PPE_ACCOUNT_ID"
          --hub hub
          --wrangler hub/node_modules/wrangler/bin/wrangler.js
          --migrations-cli hub/scripts/migrations.mjs
          --github-output "$GITHUB_OUTPUT"
      - name: Verify diagnostics and the bearer gate
        env:
          PREVIEW_BEARER_SEED: ${{ secrets.PREVIEW_BEARER_SEED }}
          PR_NUMBER: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_DIGEST: ${{ steps.provision.outputs.artifact_digest }}
          SCHEMA_DIGEST: ${{ steps.provision.outputs.schema_digest }}
        run: >-
          node infra/cf/preview-control.mjs smoke
          --repository "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER"
          --head-sha "$HEAD_SHA"
          --artifact-digest "$ARTIFACT_DIGEST"
          --schema-digest "$SCHEMA_DIGEST"
      - name: Seed deterministic fixtures through the collector upload path
        env:
          PREVIEW_BEARER_SEED: ${{ secrets.PREVIEW_BEARER_SEED }}
          PR_NUMBER: ${{ github.event.number }}
        run: >-
          node infra/cf/preview-control.mjs seed
          --repository "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER"
      - name: Run synthetic remote browser smoke
        env:
          BASE_URL: ${{ steps.provision.outputs.url }}
          PREVIEW_BEARER_SEED: ${{ secrets.PREVIEW_BEARER_SEED }}
        run: npm --prefix hub run test:e2e
      - name: Publish public preview login code
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_BEARER_SEED: ${{ secrets.PREVIEW_BEARER_SEED }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          login_url="$(node hub/scripts/preview-open.mjs --pr "$PR_NUMBER" --print-only)"
          case "$login_url" in
            *\?token=*) login_code="${login_url##*\?token=}" ;;
            *) echo "preview opener did not produce a tokenized login URL" >&2; exit 1 ;;
          esac
          {
            printf 'Preview login code (public): %s\n\n' "$login_code"
            printf 'Open preview: %s\n' "$login_url"
          } | gh pr comment "$PR_NUMBER" --body-file -

  # Sole production control plane. Index shards are created/migrated first; the main D1
  # cannot afford even checksum-ledger writes until verified copies free source pages.
  # Exact-revision maintenance, detached queue consumers and a durable 16-minute drain
  # gate precede bounded full-column copy/readback/delete. Abort leaves maintenance; a
  # later protected main run resumes from IDX00, never from an ephemeral runner journal.
  # D1 Create/Read/Write stays on CLOUDFLARE_MIGRATION_TOKEN, not the Worker deploy token.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: hub
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 360
    env:
      PROTECTED_PRODUCTION_MIGRATION: "1"
      CLOUDFLARE_ACCOUNT_ID: "18ef3246e9f36d1560485ef53889c0ab"
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - name: Reject a stale main deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_head" != "$GITHUB_SHA" ]]; then
            echo "Refusing stale deployment: run=$GITHUB_SHA current=$current_head" >&2
            exit 1
          fi
      - name: Provision immutable production index bindings
        id: index-provision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        run: >-
          node ../infra/cf/index-control.mjs provision --target production
          --config wrangler.jsonc
          --output "$RUNNER_TEMP/index-maintenance.json"
          --active-output "$RUNNER_TEMP/index-active.json"
      - name: Apply schema and ledger only to index shards
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        run: |
          set -euo pipefail
          artifact_digest="$(git archive --format=tar HEAD migrations migrations-index | sha256sum | cut -d ' ' -f 1)"
          for index in $(seq -w 0 15); do
            node scripts/migrations.mjs apply \
              --target production \
              --config "$RUNNER_TEMP/index-maintenance.json" \
              --database "IDX${index}" \
              --migrations-dir migrations-index \
              --journal "$RUNNER_TEMP/production-IDX${index}-${GITHUB_SHA}.json" \
              --artifact-digest "$artifact_digest" \
              --deployment-id "production:${GITHUB_SHA}:IDX${index}" \
              --base-manifest migrations-index/source-baseline.json
          done
          node ../infra/cf/index-control.mjs initialize --config "$RUNNER_TEMP/index-maintenance.json"
      - name: Classify the durable index layout
        id: index-layout
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        run: >-
          node ../infra/cf/index-control.mjs state
          --config "$RUNNER_TEMP/index-maintenance.json"
          --github-output "$GITHUB_OUTPUT"
      - name: Ensure dedicated production rollup queue
        run: node ../infra/cf/provision-queues.mjs --target production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      - name: Pause production queue consumers without draining messages
        id: index-pause
        if: steps.index-layout.outputs.layout_state != 'active'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: node ../infra/cf/index-control.mjs pause-consumers --config "$RUNNER_TEMP/index-active.json"
      - name: Deploy exact maintenance revision
        if: steps.index-layout.outputs.layout_state != 'active'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: npx wrangler deploy --config "$RUNNER_TEMP/index-maintenance.json" --env=""
      - name: Verify maintenance revision and drain old queues and crons
        if: steps.index-layout.outputs.layout_state != 'active'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        run: |
          node ../infra/cf/index-control.mjs health --config "$RUNNER_TEMP/index-maintenance.json" --mode maintenance
          node ../infra/cf/index-control.mjs drain --config "$RUNNER_TEMP/index-maintenance.json"
      - name: Resume full-fidelity copy and verified source deletion
        if: steps.index-layout.outputs.layout_state != 'active'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        run: node ../infra/cf/index-control.mjs copy --config "$RUNNER_TEMP/index-maintenance.json" --pass-budget-ms 18000000
      - name: Apply and verify main migrations after any required source copy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        run: |
          set -euo pipefail
          artifact_digest="$(git archive --format=tar HEAD migrations migrations-index | sha256sum | cut -d ' ' -f 1)"
          node scripts/migrations.mjs apply \
            --target production \
            --config "$RUNNER_TEMP/index-maintenance.json" \
            --database DB \
            --journal "$RUNNER_TEMP/production-DB-${GITHUB_SHA}.json" \
            --artifact-digest "$artifact_digest" \
            --deployment-id "production:${GITHUB_SHA}:DB" \
            --base-manifest migrations/source-baseline.json \
            --history migrations/historical-baseline.json
      - name: Seed and readback-verify the complete session and star catalogs
        if: steps.index-layout.outputs.layout_state != 'active'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        run: |
          node ../infra/cf/index-control.mjs seed-catalog --config "$RUNNER_TEMP/index-maintenance.json"
          node ../infra/cf/index-control.mjs ready --config "$RUNNER_TEMP/index-maintenance.json"
      - name: Reject a stale activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_head" != "$GITHUB_SHA" ]]; then
            echo "Main advanced during maintenance; retain the freeze for the next protected run." >&2
            exit 1
          fi
      - name: Deploy active revision and restore queue consumers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: npx wrangler deploy --config "$RUNNER_TEMP/index-active.json" --env=""
      - name: Verify active revision, shard SQL and viewer login
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        run: |
          node ../infra/cf/index-control.mjs health --config "$RUNNER_TEMP/index-active.json" --mode active
          node ../infra/cf/index-control.mjs reconcile-catalog --config "$RUNNER_TEMP/index-active.json"
          node ../infra/cf/index-control.mjs verify-active --config "$RUNNER_TEMP/index-active.json"
      - name: Fail closed after an interrupted or failed cutover
        if: ${{ always() && (failure() || cancelled()) && steps.index-provision.outcome == 'success' && steps.index-layout.outputs.layout_state != 'active' && (steps.index-pause.outcome == 'success' || steps.index-pause.outcome == 'failure' || steps.index-pause.outcome == 'cancelled') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: |
          pause_status=0
          node ../infra/cf/index-control.mjs pause-consumers --config "$RUNNER_TEMP/index-active.json" || pause_status=$?
          npx wrangler deploy --config "$RUNNER_TEMP/index-maintenance.json" --env=""
          exit "$pause_status"
