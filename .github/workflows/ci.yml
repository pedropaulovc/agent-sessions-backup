name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --script ../infra/cf/test_enroll_cert.py
      - run: uv sync
      - run: uv run pytest

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest

  # Migrate D1 then deploy the hub Worker, in that order, on merge to main. This is the SOLE
  # production deployer: Cloudflare Workers Builds production auto-deploy is disabled. The
  # concurrency lock keeps migration and deploy atomic; the SHA guard discards a stale run
  # that acquires the unordered lock after a newer commit. The protected `production`
  # environment holds two account-owned, expiring Cloudflare tokens with disjoint permissions;
  # see infra/cf/deploy.md.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: hub
    environment: production
    concurrency:
      group: production-hub
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - name: Check production run freshness
        id: freshness
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          latest_sha="$(git rev-parse refs/remotes/origin/main)"
          if [ "$GITHUB_SHA" = "$latest_sha" ]; then
            echo "status=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice title=Stale production run::Skipping $GITHUB_SHA; latest main is $latest_sha"
          echo "status=stale" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.freshness.outputs.status == 'current'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - if: steps.freshness.outputs.status == 'current'
        run: npm ci
      - name: Apply production D1 migrations
        if: steps.freshness.outputs.status == 'current'
        run: npx wrangler d1 migrations apply sessions-index --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      - name: Deploy production Worker
        if: steps.freshness.outputs.status == 'current'
        run: npx wrangler deploy --env ""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
