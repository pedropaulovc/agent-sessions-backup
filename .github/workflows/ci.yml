name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for every job: checkout and the deploy job's current-main read only need
# contents: read. Nothing in this workflow writes through the GitHub token.
permissions:
  contents: read

jobs:
  # A workflow expression error is not a test failure — GitHub rejects the file at VALIDATION time
  # and the run produces ZERO jobs, so every other check silently never runs. `yaml.safe_load` does
  # not catch it (the YAML is fine; the Actions expression is not). actionlint does, and would have
  # caught the `secrets`-in-`if:` that took this whole workflow down on 152d7f1.
  #
  # This job cannot catch a fatal error in its own file for the same reason it exists — validation
  # precedes job scheduling. Run `actionlint .github/workflows/*.yml` locally before pushing
  # workflow edits; this covers the non-fatal expression/shell mistakes and any other workflow file.
  actions-lint:
    runs-on: ubuntu-latest
    steps:
      # No credentials left in .git/config: nothing here needs to push, and a job that does not
      # need a token should not be holding one where a compromised action could read it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest .
          ./actionlint -color

  hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - name: Verify migrations against protected base
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/migrations.mjs check --base-ref "$MIGRATION_BASE_REF"
      - run: npm run typecheck
      - run: npm test

  browser-e2e:
    name: Browser e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm --prefix hub ci
      - name: Install Chromium and Linux browser dependencies
        if: runner.os == 'Linux'
        run: npx --prefix hub playwright install --with-deps chromium
      - name: Install Chromium
        if: runner.os == 'Windows'
        run: npx --prefix hub playwright install chromium
      - run: npm --prefix hub run test:e2e
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ runner.os }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            hub/test-results/
            hub/playwright-report/

  sessions-dev-bridge:
    name: Sessions dev bridge (native Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sessions-dev-bridge
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: sessions-dev-bridge/package-lock.json
      - run: bash -n ../scripts/install-sessions-dev-bridge-wsl.sh
      - run: npm ci --ignore-scripts
      - run: npm test

  collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --script ../infra/cf/test_enroll_cert.py
      - run: uv sync
      - run: uv run pytest

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest


  # Migrate D1, then deploy the hub Worker on merge to main. This is the SOLE deployer:
  # Cloudflare Workers Builds auto-deploy is turned OFF so nothing races us. Applying migrations
  # before the hub deploy guarantees new code never runs against the old schema — the failure
  # mode that fired the agent-backup-parse-errors alert on 2026-07-22 (PR #51's migration 0013
  # shipped but was never applied, so every ingest threw `D1_ERROR: no such column`). Gated on
  # the hub tests, which apply every migration, so a broken migration never reaches prod. A
  # shared concurrency group plus a current-main check prevents an older run approved later from
  # overwriting the Worker with stale code.
  # Requires production-environment secrets PRODUCTION_SCHEMA_BASELINE_ENVELOPE and
  # PRODUCTION_SCHEMA_BASELINE_PUBLIC_KEY, created by scripts/approve-production-baseline.mjs
  # through the independent human approval process.
  # CLOUDFLARE_MIGRATION_TOKEN is D1 Edit only. CLOUDFLARE_DEPLOY_TOKEN has Workers Scripts,
  # Queues, R2, and KV Edit plus Account Settings Read and Workers Routes Edit on vza.net.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: hub
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - name: Reject a stale main deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_head" != "$GITHUB_SHA" ]]; then
            echo "Refusing stale deployment: run=$GITHUB_SHA current=$current_head" >&2
            exit 1
          fi
      - name: Materialize independent signed production schema baseline
        env:
          PRODUCTION_SCHEMA_BASELINE_ENVELOPE: ${{ secrets.PRODUCTION_SCHEMA_BASELINE_ENVELOPE }}
          PRODUCTION_SCHEMA_BASELINE_PUBLIC_KEY: ${{ secrets.PRODUCTION_SCHEMA_BASELINE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          : "${PRODUCTION_SCHEMA_BASELINE_ENVELOPE:?production environment must provide a human-approved signed schema baseline}"
          : "${PRODUCTION_SCHEMA_BASELINE_PUBLIC_KEY:?production environment must provide its independently trusted verification key}"
          umask 077
          printf '%s' "$PRODUCTION_SCHEMA_BASELINE_ENVELOPE" > "$RUNNER_TEMP/production-schema-baseline.json"
          printf '%s' "$PRODUCTION_SCHEMA_BASELINE_PUBLIC_KEY" > "$RUNNER_TEMP/production-schema-baseline-public.pem"
      - name: Apply and verify production migrations exactly once
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        run: |
          set -euo pipefail
          artifact_digest="$(git archive --format=tar HEAD migrations | sha256sum | cut -d ' ' -f 1)"
          node scripts/migrations.mjs apply \
            --target production \
            --config wrangler.jsonc \
            --database sessions-index \
            --journal "$RUNNER_TEMP/production-migration-${GITHUB_SHA}.json" \
            --artifact-digest "$artifact_digest" \
            --deployment-id "production:${GITHUB_SHA}" \
            --base-manifest migrations/source-baseline.json \
            --history migrations/historical-baseline.json \
            --baseline "$RUNNER_TEMP/production-schema-baseline.json" \
            --baseline-public-key "$RUNNER_TEMP/production-schema-baseline-public.pem"
      - name: Deploy production hub
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}

