name: Preview Queue

on:
  # zizmor: ignore[dangerous-triggers]
  # The job checks out only default-branch code and never executes the PR head.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

# Queue events validate the live head immediately before and after publishing. They intentionally
# do not serialize: an obsolete event must not delay the current head. If CI already finished
# before a delayed queue job starts, the trusted reconciler dispatches the same locked controller.

jobs:
  queue:
    # PR head code never runs here. Fork previews stay excluded because a base-repository token
    # must not create a durable public deployment record for untrusted source.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      actions: write
      contents: read
      deployments: write
      pull-requests: read
    steps:
      - name: Check out trusted default-branch queue code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Publish the queued PR deployment card
        id: publish
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          node trusted/infra/cf/preview-control.mjs deployment-queue
          --repository "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER"
          --head-sha "$HEAD_SHA"
          --run-id "$GITHUB_RUN_ID"
          --workflow-ref "$GITHUB_WORKFLOW_REF"
          --github-output "$GITHUB_OUTPUT"
      - name: Reconcile a CI that completed before this queue card
        if: always() && steps.publish.outputs.deployment_id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPLOYMENT_ID: ${{ steps.publish.outputs.deployment_id }}
        run: >-
          node trusted/infra/cf/preview-control.mjs deployment-reconcile
          --repository "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER"
          --head-sha "$HEAD_SHA"
          --deployment-id "$DEPLOYMENT_ID"
          --run-id "$GITHUB_RUN_ID"
          --workflow-ref "$GITHUB_WORKFLOW_REF"
      - name: Require a created deployment card
        if: always() && steps.publish.outputs.deployment_id == ''
        run: exit 1
