name: Preview Janitor

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: preview-janitor
  cancel-in-progress: false

jobs:
  # Preview resources carry deterministic pr-N-* names, so ownership IS the name: the janitor
  # lists the non-production account, groups pr-N-* resources by PR, and deletes every resource
  # belonging to a CLOSED PR (covering close runs that failed or raced) plus all debris from the
  # retired per-generation naming scheme. Not-found is idempotent.
  clean-preview-resources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview-control
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted default-branch janitor
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sweep closed-PR environments and legacy debris
        env:
          CLOUDFLARE_PREVIEW_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PREVIEW_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node infra/cf/preview-control.mjs janitor
          --repository "$GITHUB_REPOSITORY"
          --account-id "$CLOUDFLARE_PREVIEW_ACCOUNT_ID"
