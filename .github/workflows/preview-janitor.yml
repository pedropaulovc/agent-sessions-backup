name: Preview Janitor

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: preview-janitor
  cancel-in-progress: false

jobs:
  # Preview resources carry deterministic pr-N-* names, so ownership IS the name: the janitor
  # lists the non-production account, groups pr-N-* resources by PR, and deletes every resource
  # belonging to a CLOSED PR (covering close runs that failed or raced) plus all debris from the
  # retired per-generation naming scheme. Not-found is idempotent.
  clean-preview-resources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview-control
    permissions:
      contents: read
      pull-requests: read
    outputs:
      closed_prs: ${{ steps.janitor.outputs.closed_prs }}
    steps:
      - name: Check out trusted default-branch janitor
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sweep closed-PR environments and legacy debris
        id: janitor
        env:
          CLOUDFLARE_PREVIEW_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PREVIEW_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node infra/cf/preview-control.mjs janitor
          --repository "$GITHUB_REPOSITORY"
          --account-id "$CLOUDFLARE_PREVIEW_ACCOUNT_ID"
          --github-output "$GITHUB_OUTPUT"

  # This no-secret follow-up avoids a matrix fan-out limit while preserving one auditable
  # inactive status per removed PR.
  inactivate-deployment-cards:
    needs: clean-preview-resources
    if: >-
      needs.clean-preview-resources.result == 'success' &&
      needs.clean-preview-resources.outputs.closed_prs != '' &&
      needs.clean-preview-resources.outputs.closed_prs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out trusted default-branch deployment-card code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mark removed preview deployment cards inactive
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOSED_PRS: ${{ needs.clean-preview-resources.outputs.closed_prs }}
        run: >-
          node infra/cf/preview-control.mjs deployment-inactivate-batch
          --repository "$GITHUB_REPOSITORY"
          --prs "$CLOSED_PRS"
