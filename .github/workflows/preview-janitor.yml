name: Preview Janitor

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: preview-janitor
  cancel-in-progress: false

jobs:
  # The janitor never lists Cloudflare and guesses ownership from prefixes. It requests the trusted
  # front-door registry, preserves open PR live/rollback generations, and deletes only typed,
  # exact-name inventory released by an authenticated janitor transition. Not-found is idempotent.
  clean-recorded-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview-control
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted default-branch janitor
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clean typed trusted inventory
        env:
          CLOUDFLARE_PREVIEW_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PREVIEW_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_CONTROL_JANITOR_AUD: ${{ vars.PREVIEW_CONTROL_JANITOR_AUD }}
          PREVIEW_CONTROL_URL: ${{ vars.PREVIEW_CONTROL_URL }}
        run: >-
          node infra/cf/preview-control.mjs janitor
          --repository "$GITHUB_REPOSITORY"
          --account-id "$CLOUDFLARE_PREVIEW_ACCOUNT_ID"
