name: Preview Close

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number whose preview environment to tear down (also the manual RESET lever for an open PR — the next CI run reprovisions it empty)
        required: true
        type: number

permissions: {}

concurrency:
  group: preview-pr-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  # pull_request_target is used only as a close signal; this job never checks out, imports,
  # reads, or executes the PR head. Preview resources have deterministic stable names (pr-N-*),
  # so teardown is a name-addressed delete — no registry or state store involved.
  # workflow_dispatch doubles as the explicit environment RESET: dispatching against an OPEN PR
  # deletes its persistent D1/R2/KV/queues/Worker, and the next CI run (re-run or push)
  # provisions a fresh environment from scratch.
  delete-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out default-branch cleanup code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate manual target exists
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ inputs.pr }}
        shell: bash
        run: gh api "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR" --jq '.number' > /dev/null
      - name: Delete the per-PR preview environment
        env:
          CLOUDFLARE_PPE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_PPE_ACCOUNT_ID }}
          CLOUDFLARE_PPE_API_TOKEN: ${{ secrets.CLOUDFLARE_PPE_API_TOKEN }}
          PREVIEW_CLOSE_PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: >-
          node infra/cf/preview-control.mjs close
          --repository "$GITHUB_REPOSITORY"
          --pr "$PREVIEW_CLOSE_PR"
          --account-id "$CLOUDFLARE_PPE_ACCOUNT_ID"

  # Removal is the one preview state a job conclusion cannot express: the deployment cards were
  # closed by the CI runs that created them and would keep advertising a URL that now 404s. This
  # job holds `deployments: write` and no Cloudflare credential, and runs only after the delete.
  inactivate-deployment-card:
    needs: delete-environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out default-branch deployment-card code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Mark removed preview deployment cards inactive
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_CLOSE_PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: >-
          node infra/cf/preview-control.mjs deployment-inactivate
          --repository "$GITHUB_REPOSITORY"
          --pr "$PREVIEW_CLOSE_PR"
