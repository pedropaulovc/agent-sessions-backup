name: Preview Close

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number whose preview environment to tear down (also the manual RESET lever for an open PR — the next CI run reprovisions it empty)
        required: true
        type: number

permissions: {}

concurrency:
  group: preview-pr-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  # pull_request_target is used only as a trusted close signal; this job never checks out,
  # imports, reads, or executes the PR head. Preview resources have deterministic stable names
  # (pr-N-*), so teardown is a name-addressed delete — no registry or state store involved.
  # workflow_dispatch doubles as the explicit environment RESET: dispatching against an OPEN PR
  # deletes its persistent D1/R2/KV/queues/Worker, and the next Preview Control run (re-run CI or
  # push) provisions a fresh environment from scratch.
  delete-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview-control
    outputs:
      manual_target_state: ${{ steps.target.outputs.state }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted default-branch cleanup code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate manual target exists
        id: target
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ inputs.pr }}
        shell: bash
        run: |
          state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR" --jq '.state')"
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Delete the per-PR preview environment
        env:
          CLOUDFLARE_PREVIEW_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PREVIEW_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_CLOSE_PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: >-
          node infra/cf/preview-control.mjs close
          --repository "$GITHUB_REPOSITORY"
          --pr "$PREVIEW_CLOSE_PR"
          --account-id "$CLOUDFLARE_PREVIEW_ACCOUNT_ID"

  # Keep GitHub deployment write separate from the Cloudflare token. This runs only after the
  # trusted, name-addressed deletion succeeds and never receives the protected environment.
  inactivate-deployment-card:
    needs: delete-environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out trusted default-branch deployment-card code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Mark removed preview deployment cards inactive
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_CLOSE_PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: >-
          node infra/cf/preview-control.mjs deployment-inactivate
          --repository "$GITHUB_REPOSITORY"
          --pr "$PREVIEW_CLOSE_PR"

  # A manual RESET is for an open PR. Requeue a trusted card after teardown so a CI re-run can
  # claim it without pretending an old inactive card is still live. Closed-PR cleanup never does
  # this, so it cannot revive a deployment after its PR has closed.
  queue-reset-deployment-card:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.delete-environment.outputs.manual_target_state == 'open'
    needs: [delete-environment, inactivate-deployment-card]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: read
    steps:
      - name: Check out trusted default-branch reset-card code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Queue the reset deployment card
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_CLOSE_PR: ${{ inputs.pr }}
        run: >-
          node infra/cf/preview-control.mjs deployment-reset-queue
          --repository "$GITHUB_REPOSITORY"
          --pr "$PREVIEW_CLOSE_PR"
          --run-id "$GITHUB_RUN_ID"
          --workflow-ref "$GITHUB_WORKFLOW_REF"
