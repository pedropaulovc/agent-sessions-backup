name: Preview Close

on:
  pull_request_target:
    types: [closed]

permissions: {}

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # pull_request_target is used only as a trusted close signal. This job never checks out, imports,
  # reads, or executes the PR head. The close CAS first writes a permanent tombstone and clears all
  # routable tuples; only the typed inventory returned by that transition is eligible for deletion.
  tombstone-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview-control
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted default-branch cleanup code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tombstone routing and delete recorded typed inventory
        env:
          CLOUDFLARE_PREVIEW_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PREVIEW_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_CONTROL_CLOSE_AUD: ${{ vars.PREVIEW_CONTROL_CLOSE_AUD }}
          PREVIEW_CONTROL_URL: ${{ vars.PREVIEW_CONTROL_URL }}
        run: >-
          node infra/cf/preview-control.mjs close
          --repository "$GITHUB_REPOSITORY"
          --pr "${{ github.event.pull_request.number }}"
          --head-sha "${{ github.event.pull_request.head.sha }}"
          --account-id "$CLOUDFLARE_PREVIEW_ACCOUNT_ID"
