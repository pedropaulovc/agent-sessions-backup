name: Preview Close

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Closed PR number to recover
        required: true
        type: number
      head_sha:
        description: Closed PR head SHA
        required: true
        type: string

permissions: {}

concurrency:
  group: preview-pr-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  # pull_request_target is used only as a trusted close signal. workflow_dispatch provides a
  # protected-environment recovery path for a close run that failed after the PR became immutable.
  # This job never checks out, imports, reads, or executes the PR head. The close CAS first writes a
  # permanent tombstone and clears all routable tuples; only the typed inventory returned by that
  # transition is eligible for deletion.
  tombstone-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview-control
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - name: Check out trusted default-branch cleanup code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manual recovery target
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_HEAD_SHA: ${{ inputs.head_sha }}
          RECOVERY_PR: ${{ inputs.pr }}
        shell: bash
        run: |
          target=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RECOVERY_PR" --jq '[.state, .head.sha] | @tsv')
          IFS=$'\t' read -r state actual_head_sha <<< "$target"
          if [[ "$state" != "closed" || "$actual_head_sha" != "$RECOVERY_HEAD_SHA" ]]; then
            echo "Recovery target must be a closed PR with the supplied head SHA" >&2
            exit 1
          fi
      - name: Tombstone routing and delete recorded typed inventory
        env:
          CLOUDFLARE_PREVIEW_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PREVIEW_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_CONTROL_CLOSE_AUD: ${{ vars.PREVIEW_CONTROL_CLOSE_AUD }}
          PREVIEW_CONTROL_URL: ${{ vars.PREVIEW_CONTROL_URL }}
          PREVIEW_CLOSE_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          PREVIEW_CLOSE_PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: >-
          node infra/cf/preview-control.mjs close
          --repository "$GITHUB_REPOSITORY"
          --pr "$PREVIEW_CLOSE_PR"
          --head-sha "$PREVIEW_CLOSE_HEAD_SHA"
          --account-id "$CLOUDFLARE_PREVIEW_ACCOUNT_ID"
