name: Delete obsolete PPE resources

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type delete-sessions-ppe to remove the shared PPE Worker, custom domain, secrets, and D1
        required: true
        type: string

permissions: {}

concurrency:
  group: ppe-cleanup
  cancel-in-progress: false

jobs:
  delete:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: 18ef3246e9f36d1560485ef53889c0ab
      CLOUDFLARE_API_BASE: https://api.cloudflare.com/client/v4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: hub/package-lock.json

      - run: npm ci
        working-directory: hub

      - name: Validate destructive target
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == delete-sessions-ppe ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          current_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current_head" == "$GITHUB_SHA" ]]

      - name: Prepare immutable PPE target configuration
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/wrangler.ppe.jsonc" <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "sessions-ppe",
            "account_id": "18ef3246e9f36d1560485ef53889c0ab",
            "workers_dev": true,
            "routes": [
              { "pattern": "sessions.ppe.vza.net", "custom_domain": true }
            ],
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "sessions-ppe-index"
              }
            ]
          }
          EOF

      - name: Verify production account boundary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          account="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            "$CLOUDFLARE_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID")"
          jq -e --arg id "$CLOUDFLARE_ACCOUNT_ID" \
            '.success == true and .result.id == $id' <<<"$account" >/dev/null

      - name: Remove PPE custom domain and route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          domains="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            "$CLOUDFLARE_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
          while IFS= read -r domain_id; do
            [[ -z "$domain_id" ]] && continue
            curl --fail-with-body --silent --show-error --request DELETE \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              "$CLOUDFLARE_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains/$domain_id" >/dev/null
          done < <(jq -r '.result[]? | select(.hostname == "sessions.ppe.vza.net") | .id' <<<"$domains")

      - name: Delete PPE Worker and secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        working-directory: hub
        run: |
          set -euo pipefail
          npx wrangler delete sessions-ppe --config "$RUNNER_TEMP/wrangler.ppe.jsonc" --force

      - name: Delete isolated PPE D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        working-directory: hub
        run: |
          set -euo pipefail
          npx wrangler d1 delete sessions-ppe-index \
            --config "$RUNNER_TEMP/wrangler.ppe.jsonc" \
            --skip-confirmation

      - name: Verify PPE resources are absent
        env:
          CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_MIGRATION_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        run: |
          set -euo pipefail
          worker_status="$(curl --silent --show-error --output "$RUNNER_TEMP/worker.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_DEPLOY_TOKEN" \
            --header 'Content-Type: application/json' \
            "$CLOUDFLARE_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/sessions-ppe/settings")"
          [[ "$worker_status" == 404 ]]

          d1="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_MIGRATION_TOKEN" \
            --header 'Content-Type: application/json' \
            "$CLOUDFLARE_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=sessions-ppe-index")"
          jq -e '(.success == true) and ((.result // []) | length == 0)' <<<"$d1" >/dev/null

          domains="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_DEPLOY_TOKEN" \
            --header 'Content-Type: application/json' \
            "$CLOUDFLARE_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
          ! jq -e '.result[]? | select(.hostname == "sessions.ppe.vza.net")' <<<"$domains" >/dev/null
