name: Preview Control

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number for a verified late queue reconciliation
        required: true
        type: number
      head_sha:
        description: Current same-repository PR head SHA
        required: true
        type: string
      source_run_id:
        description: Successful CI workflow run ID for this head
        required: true
        type: number

permissions: {}

concurrency:
  group: preview-pr-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  # An unsuccessful same-repository CI must settle its already-queued card rather than leave the
  # PR showing work that will never start. This uses only trusted default-branch code and has no
  # Cloudflare or bearer secret.
  reject_deployment_card:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: read
    steps:
      - name: Check out trusted deployment-card code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Reject queued PR deployment cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: >-
          node trusted/infra/cf/preview-control.mjs deployment-reject
          --repository "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER"
          --head-sha "$HEAD_SHA"
          --source-run-id "$SOURCE_RUN_ID"
          --run-id "$GITHUB_RUN_ID"
          --workflow-ref "$GITHUB_WORKFLOW_REF"

  # The card is claimed before the isolated build so its state remains the durable lifecycle
  # lock. A late direct queue can dispatch this same controller; in-progress/success cards make
  # that retry an idempotent no-op.
  build:
    needs: [deployment_card, recover_deployment_card]
    if: >-
      always() &&
      (
        (needs.deployment_card.result == 'success' &&
          needs.deployment_card.outputs.claimed == 'true') ||
        (needs.recover_deployment_card.result == 'success' &&
          needs.recover_deployment_card.outputs.claimed == 'true')
      ) &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.pull_requests[0].number != null))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      pr: ${{ inputs.pr || github.event.workflow_run.pull_requests[0].number }}
      head_sha: ${{ inputs.head_sha || github.event.workflow_run.head_sha }}
      source_run_id: ${{ inputs.source_run_id || github.event.workflow_run.id }}
    steps:
      - name: Check out trusted default-branch drivers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Check out exact PR head as untrusted input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.head_sha || github.event.workflow_run.head_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            trusted/hub/package-lock.json
            source/hub/package-lock.json
      - name: Acquire dependencies without lifecycle scripts
        run: |
          npm --prefix trusted/hub ci --ignore-scripts --no-audit --no-fund
          npm --prefix source/hub ci --ignore-scripts --no-audit --no-fund
      - name: Build in a network-isolated namespace
        env:
          PR_NUMBER: ${{ inputs.pr || github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
          BUILD_RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: >-
          sudo unshare --net --
          "$(command -v node)" trusted/infra/cf/preview-build.mjs
          --source source
          --trusted-root trusted
          --out preview-artifact
          --repository "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER"
          --head-sha "$HEAD_SHA"
          --source-run-id "$SOURCE_RUN_ID"
          --build-run-id "$BUILD_RUN_ID"
          --run-attempt "$RUN_ATTEMPT"
          --workflow-ref "$TRUSTED_WORKFLOW_REF"
      - name: Restore artifact ownership
        run: sudo chown -R "$(id -u):$(id -g)" preview-artifact
      - name: Upload hermetic preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-${{ github.run_id }}-${{ inputs.head_sha || github.event.workflow_run.head_sha }}
          path: preview-artifact
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  # Only this job receives the non-production Cloudflare token. It checks out main, never the PR,
  # and treats every downloaded artifact byte as hostile until provenance verification. It deploys
  # the PR's SELF-CONTAINED preview in place: stable pr-N-* resources (persistent across pushes),
  # the Worker publicly reachable at its stable workers.dev hostname, gated by the derived per-PR
  # bearer (HMAC of PREVIEW_BEARER_SEED — never moved through logs or artifacts).
  provision:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview-control
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      url: ${{ steps.provision.outputs.url }}
      artifact_digest: ${{ steps.provision.outputs.artifact_digest }}
      schema_digest: ${{ steps.provision.outputs.schema_digest }}
    steps:
      - name: Check out trusted default-branch control code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trusted/hub/package-lock.json
      - name: Install pinned trusted toolchain only
        run: npm --prefix trusted/hub ci --ignore-scripts --no-audit --no-fund
      - name: Download artifact from this trusted workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preview-${{ github.run_id }}-${{ needs.build.outputs.head_sha }}
          path: preview-artifact
      - name: Provision, migrate, and deploy the self-contained preview
        id: provision
        env:
          CLOUDFLARE_PREVIEW_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PREVIEW_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_BEARER_SEED: ${{ secrets.PREVIEW_BEARER_SEED }}
          # Expression values are bound as environment variables, never interpolated into
          # the shell command: this job holds credentials, so an expansion that ever came
          # to carry shell metacharacters must stay inert data.
          PR_NUMBER: ${{ needs.build.outputs.pr }}
          HEAD_SHA: ${{ needs.build.outputs.head_sha }}
          SOURCE_RUN_ID: ${{ needs.build.outputs.source_run_id }}
        run: >-
          node trusted/infra/cf/preview-control.mjs provision
          --artifact preview-artifact
          --repository "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER"
          --head-sha "$HEAD_SHA"
          --source-run-id "$SOURCE_RUN_ID"
          --run-id "$GITHUB_RUN_ID"
          --workflow-ref "$GITHUB_WORKFLOW_REF"
          --account-id "$CLOUDFLARE_PREVIEW_ACCOUNT_ID"
          --wrangler trusted/hub/node_modules/wrangler/bin/wrangler.js
          --migrations-cli trusted/hub/scripts/migrations.mjs
          --github-output "$GITHUB_OUTPUT"

  # A no-secret job owns the GitHub deployment write grant and claims before the build. Its
  # in-progress status is the durable lock: a late trusted reconciliation sees that state and
  # skips a duplicate controller.
  deployment_card:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.pull_requests[0].number != null)
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: read
    outputs:
      id: ${{ steps.create.outputs.deployment_id }}
      claimed: ${{ steps.create.outputs.claimed }}
    steps:
      - name: Check out trusted deployment-card code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Claim queued PR deployment while provisioning runs
        id: create
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr || github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
        run: >-
          node trusted/infra/cf/preview-control.mjs deployment-claim
          --repository "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER"
          --head-sha "$HEAD_SHA"
          --source-run-id "$SOURCE_RUN_ID"
          --run-id "$GITHUB_RUN_ID"
          --workflow-ref "$GITHUB_WORKFLOW_REF"
          --github-output "$GITHUB_OUTPUT"

  # A failed status write can leave the exact card visible but unclaimed. Retry once in the same
  # trusted workflow run before build; the claim command recognizes an in-progress status written
  # by this run, but does not resume a card owned by a different controller.
  recover_deployment_card:
    needs: deployment_card
    if: >-
      always() &&
      needs.deployment_card.result == 'failure' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.pull_requests[0].number != null))
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: read
    outputs:
      id: ${{ steps.retry.outputs.deployment_id }}
      claimed: ${{ steps.retry.outputs.claimed }}
    steps:
      - name: Check out trusted deployment-card code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Retry a transient deployment-card claim
        id: retry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr || github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
        run: >-
          node trusted/infra/cf/preview-control.mjs deployment-claim
          --repository "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER"
          --head-sha "$HEAD_SHA"
          --source-run-id "$SOURCE_RUN_ID"
          --run-id "$GITHUB_RUN_ID"
          --workflow-ref "$GITHUB_WORKFLOW_REF"
          --github-output "$GITHUB_OUTPUT"

  # Smoke needs no Cloudflare token: it derives the same per-PR bearer from the seed and talks to
  # the preview over plain HTTPS, exactly like an agent or the owner's browser would.
  smoke:
    needs: [build, provision]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview-control
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted smoke code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trusted/hub/package-lock.json
      - name: Install trusted browser dependencies
        run: npm --prefix trusted/hub ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx --prefix trusted/hub playwright install --with-deps chromium
      - name: Verify diagnostics and the bearer gate
        env:
          PREVIEW_BEARER_SEED: ${{ secrets.PREVIEW_BEARER_SEED }}
          PR_NUMBER: ${{ needs.build.outputs.pr }}
          HEAD_SHA: ${{ needs.build.outputs.head_sha }}
          ARTIFACT_DIGEST: ${{ needs.provision.outputs.artifact_digest }}
          SCHEMA_DIGEST: ${{ needs.provision.outputs.schema_digest }}
        run: >-
          node trusted/infra/cf/preview-control.mjs smoke
          --repository "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER"
          --head-sha "$HEAD_SHA"
          --artifact-digest "$ARTIFACT_DIGEST"
          --schema-digest "$SCHEMA_DIGEST"
      - name: Seed deterministic fixtures through the collector upload path
        env:
          PREVIEW_BEARER_SEED: ${{ secrets.PREVIEW_BEARER_SEED }}
          PR_NUMBER: ${{ needs.build.outputs.pr }}
        run: >-
          node trusted/infra/cf/preview-control.mjs seed
          --repository "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER"
      - name: Run synthetic remote browser smoke
        env:
          BASE_URL: ${{ needs.provision.outputs.url }}
          PREVIEW_BEARER_SEED: ${{ secrets.PREVIEW_BEARER_SEED }}
        run: npm --prefix trusted/hub run test:e2e

  # Completes the exact deployment recorded before its in-progress status write, including when
  # either provisioning or smoke fails. This job has no Cloudflare or bearer secret; trusted main
  # revalidates the PR head before the terminal status write.
  complete_deployment_card:
    needs: [build, provision, deployment_card, recover_deployment_card, smoke]
    if: >-
      always() &&
      (
        (needs.deployment_card.result == 'success' &&
          needs.deployment_card.outputs.claimed == 'true') ||
        (needs.recover_deployment_card.result == 'success' &&
          needs.recover_deployment_card.outputs.claimed == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: read
    steps:
      - name: Check out trusted deployment-card code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Publish the terminal preview deployment status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr || github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
          DEPLOYMENT_ID: ${{ needs.recover_deployment_card.outputs.id || needs.deployment_card.outputs.id }}
          BUILD_RESULT: ${{ needs.build.result }}
          PROVISION_RESULT: ${{ needs.provision.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          set -euo pipefail
          outcome=provision-failure
          case "$BUILD_RESULT" in
            cancelled) outcome=provision-cancelled ;;
            skipped) outcome=provision-skipped ;;
            success)
              case "$PROVISION_RESULT" in
                cancelled) outcome=provision-cancelled ;;
                skipped) outcome=provision-skipped ;;
                success)
                  case "$SMOKE_RESULT" in
                    success) outcome=success ;;
                    cancelled) outcome=smoke-cancelled ;;
                    skipped) outcome=smoke-skipped ;;
                    *) outcome=smoke-failure ;;
                  esac
                  ;;
              esac
              ;;
          esac
          for attempt in 1 2 3; do
            if node trusted/infra/cf/preview-control.mjs deployment-status \
              --repository "$GITHUB_REPOSITORY" \
              --pr "$PR_NUMBER" \
              --head-sha "$HEAD_SHA" \
              --source-run-id "$SOURCE_RUN_ID" \
              --run-id "$GITHUB_RUN_ID" \
              --workflow-ref "$GITHUB_WORKFLOW_REF" \
              --deployment-id "$DEPLOYMENT_ID" \
              --outcome "$outcome"; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep "$attempt"
          done

  # If the former head became stale before either a claim or terminal status could be written,
  # retire only cards for that exact SHA. Current-head card-discovery failures are explicit
  # no-ops here; the late queue reconciler retries them with verified CI provenance.
  supersede_stale_deployment_cards:
    needs: [build, deployment_card, recover_deployment_card, complete_deployment_card]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success') &&
      (
        (needs.deployment_card.result != 'success' &&
          needs.recover_deployment_card.result != 'success') ||
        (
          (
            (needs.deployment_card.result == 'success' &&
              needs.deployment_card.outputs.claimed == 'true') ||
            (needs.recover_deployment_card.result == 'success' &&
              needs.recover_deployment_card.outputs.claimed == 'true')
          ) &&
          (needs.build.result != 'success' ||
            needs.complete_deployment_card.result != 'success')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: read
    steps:
      - name: Check out trusted deployment-card code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Retire cards for a superseded PR head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr || github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
        run: >-
          node trusted/infra/cf/preview-control.mjs deployment-supersede
          --repository "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER"
          --head-sha "$HEAD_SHA"
          --source-run-id "$SOURCE_RUN_ID"
          --run-id "$GITHUB_RUN_ID"
          --workflow-ref "$GITHUB_WORKFLOW_REF"
