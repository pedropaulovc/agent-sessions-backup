name: Preview Control

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: preview-pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  # Trusted main drives a PR checkout only as build input. No Cloudflare credential, environment
  # secret, repository write grant, PR action, PR lifecycle hook, or PR Wrangler config is used.
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      pr: ${{ github.event.workflow_run.pull_requests[0].number }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out trusted default-branch drivers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Check out exact PR head as untrusted input
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            trusted/hub/package-lock.json
            source/hub/package-lock.json
      - name: Acquire dependencies without lifecycle scripts
        run: |
          npm --prefix trusted/hub ci --ignore-scripts --no-audit --no-fund
          npm --prefix source/hub ci --ignore-scripts --no-audit --no-fund
      - name: Build in a network-isolated namespace
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          BUILD_RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: >-
          sudo unshare --net --
          "$(command -v node)" trusted/infra/cf/preview-build.mjs
          --source source
          --trusted-root trusted
          --out preview-artifact
          --repository "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER"
          --head-sha "$HEAD_SHA"
          --source-run-id "$SOURCE_RUN_ID"
          --build-run-id "$BUILD_RUN_ID"
          --run-attempt "$RUN_ATTEMPT"
          --workflow-ref "$TRUSTED_WORKFLOW_REF"
      - name: Restore artifact ownership
        run: sudo chown -R "$(id -u):$(id -g)" preview-artifact
      - name: Upload hermetic preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.run_id }}-${{ github.event.workflow_run.head_sha }}
          path: preview-artifact
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  # Only this job receives the separate non-production control token. It checks out main, never
  # the PR, and treats every downloaded artifact byte as hostile until provenance verification.
  provision:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview-control
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read
    outputs:
      generation: ${{ steps.provision.outputs.generation }}
      artifact_digest: ${{ steps.provision.outputs.artifact_digest }}
      schema_digest: ${{ steps.provision.outputs.schema_digest }}
    steps:
      - name: Check out trusted default-branch control code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trusted/hub/package-lock.json
      - name: Install pinned trusted toolchain only
        run: npm --prefix trusted/hub ci --ignore-scripts --no-audit --no-fund
      - name: Download artifact from this trusted workflow run
        uses: actions/download-artifact@v4
        with:
          name: preview-${{ github.run_id }}-${{ needs.build.outputs.head_sha }}
          path: preview-artifact
      - name: Provision, migrate, and register exact candidate
        id: provision
        env:
          CLOUDFLARE_PREVIEW_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PREVIEW_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_ACTION_ASSERTION_JWKS: ${{ vars.PREVIEW_ACTION_ASSERTION_JWKS }}
          PREVIEW_ASSERTION_ISSUER: ${{ vars.PREVIEW_ASSERTION_ISSUER }}
          PREVIEW_BROWSER_ASSERTION_JWKS: ${{ vars.PREVIEW_BROWSER_ASSERTION_JWKS }}
          PREVIEW_ORIGIN_ASSERTION_JWKS: ${{ vars.PREVIEW_ORIGIN_ASSERTION_JWKS }}
          PREVIEW_CONTROL_DEPLOY_AUD: ${{ vars.PREVIEW_CONTROL_DEPLOY_AUD }}
          PREVIEW_CONTROL_URL: ${{ vars.PREVIEW_CONTROL_URL }}
        run: >-
          node trusted/infra/cf/preview-control.mjs provision
          --artifact preview-artifact
          --journal "$RUNNER_TEMP/preview-control-journal.json"
          --repository "$GITHUB_REPOSITORY"
          --pr "${{ needs.build.outputs.pr }}"
          --head-sha "${{ needs.build.outputs.head_sha }}"
          --source-run-id "${{ github.event.workflow_run.id }}"
          --run-id "$GITHUB_RUN_ID"
          --workflow-ref "$GITHUB_WORKFLOW_REF"
          --account-id "$CLOUDFLARE_PREVIEW_ACCOUNT_ID"
          --wrangler trusted/hub/node_modules/wrangler/bin/wrangler.js
          --migrations-cli trusted/hub/scripts/migrations.mjs
          --github-output "$GITHUB_OUTPUT"
      - name: Remove unregistered partial generation
        if: ${{ always() && steps.provision.outcome != 'success' }}
        env:
          CLOUDFLARE_PREVIEW_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PREVIEW_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_CONTROL_URL: ${{ vars.PREVIEW_CONTROL_URL }}
        run: >-
          node trusted/infra/cf/preview-control.mjs cleanup-journal
          --journal "$RUNNER_TEMP/preview-control-journal.json"
          --repository "$GITHUB_REPOSITORY"
          --pr "${{ needs.build.outputs.pr }}"
          --account-id "$CLOUDFLARE_PREVIEW_ACCOUNT_ID"

  # Remote smoke receives only one-use, OIDC-minted front-door grants. It has no Cloudflare token
  # and executes trusted default-branch tests, never test code or configuration from the PR.
  smoke:
    needs: [build, provision]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview-control
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - name: Check out trusted smoke code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trusted/hub/package-lock.json
      - name: Install trusted browser dependencies
        run: npm --prefix trusted/hub ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx --prefix trusted/hub playwright install --with-deps chromium
      - name: Seed deterministic fixtures through one-use candidate actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_CONTROL_DEPLOY_AUD: ${{ vars.PREVIEW_CONTROL_DEPLOY_AUD }}
          PREVIEW_CONTROL_URL: ${{ vars.PREVIEW_CONTROL_URL }}
        run: >-
          node trusted/infra/cf/preview-control.mjs seed
          --repository "$GITHUB_REPOSITORY"
          --pr "${{ needs.build.outputs.pr }}"
          --head-sha "${{ needs.build.outputs.head_sha }}"
          --source-run-id "${{ github.event.workflow_run.id }}"
          --generation "${{ needs.provision.outputs.generation }}"
      - name: Verify candidate diagnostics through exact route
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_CONTROL_DEPLOY_AUD: ${{ vars.PREVIEW_CONTROL_DEPLOY_AUD }}
          PREVIEW_CONTROL_URL: ${{ vars.PREVIEW_CONTROL_URL }}
        run: >-
          node trusted/infra/cf/preview-control.mjs smoke
          --repository "$GITHUB_REPOSITORY"
          --pr "${{ needs.build.outputs.pr }}"
          --head-sha "${{ needs.build.outputs.head_sha }}"
          --source-run-id "${{ github.event.workflow_run.id }}"
          --generation "${{ needs.provision.outputs.generation }}"
      - name: Mint one-use browser bootstrap without logging it
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_CONTROL_DEPLOY_AUD: ${{ vars.PREVIEW_CONTROL_DEPLOY_AUD }}
          PREVIEW_CONTROL_URL: ${{ vars.PREVIEW_CONTROL_URL }}
        run: >-
          node trusted/infra/cf/preview-control.mjs browser-grant
          --repository "$GITHUB_REPOSITORY"
          --pr "${{ needs.build.outputs.pr }}"
          --head-sha "${{ needs.build.outputs.head_sha }}"
          --source-run-id "${{ github.event.workflow_run.id }}"
          --generation "${{ needs.provision.outputs.generation }}"
          --output "$RUNNER_TEMP/preview-browser-grant.json"
      - name: Run synthetic remote browser smoke
        env:
          BASE_URL: https://pr-${{ needs.build.outputs.pr }}-preview.sessions.vza.net
          PREVIEW_BOOTSTRAP_FILE: ${{ runner.temp }}/preview-browser-grant.json
        run: npm --prefix trusted/hub run test:e2e

  # Promotion is a final PR-head check and front-door tuple CAS. It cannot overwrite a newer head
  # or a close tombstone and does not hold a Cloudflare administration credential.
  promote:
    needs: [build, provision, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: preview-control
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Promote exact candidate tuple
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_CONTROL_DEPLOY_AUD: ${{ vars.PREVIEW_CONTROL_DEPLOY_AUD }}
          PREVIEW_CONTROL_URL: ${{ vars.PREVIEW_CONTROL_URL }}
        run: >-
          node trusted/infra/cf/preview-control.mjs promote
          --repository "$GITHUB_REPOSITORY"
          --pr "${{ needs.build.outputs.pr }}"
          --head-sha "${{ needs.build.outputs.head_sha }}"
          --source-run-id "${{ github.event.workflow_run.id }}"
          --generation "${{ needs.provision.outputs.generation }}"
