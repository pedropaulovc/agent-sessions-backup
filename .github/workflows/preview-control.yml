name: Preview Control

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: preview-pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  # Trusted main drives a PR checkout only as build input. No Cloudflare credential, environment
  # secret, repository write grant, PR action, PR lifecycle hook, or PR Wrangler config is used.
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      pr: ${{ github.event.workflow_run.pull_requests[0].number }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out trusted default-branch drivers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Check out exact PR head as untrusted input
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            trusted/hub/package-lock.json
            source/hub/package-lock.json
      - name: Acquire dependencies without lifecycle scripts
        run: |
          npm --prefix trusted/hub ci --ignore-scripts --no-audit --no-fund
          npm --prefix source/hub ci --ignore-scripts --no-audit --no-fund
      - name: Build in a network-isolated namespace
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          BUILD_RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: >-
          sudo unshare --net --
          "$(command -v node)" trusted/infra/cf/preview-build.mjs
          --source source
          --trusted-root trusted
          --out preview-artifact
          --repository "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER"
          --head-sha "$HEAD_SHA"
          --source-run-id "$SOURCE_RUN_ID"
          --build-run-id "$BUILD_RUN_ID"
          --run-attempt "$RUN_ATTEMPT"
          --workflow-ref "$TRUSTED_WORKFLOW_REF"
      - name: Restore artifact ownership
        run: sudo chown -R "$(id -u):$(id -g)" preview-artifact
      - name: Upload hermetic preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.run_id }}-${{ github.event.workflow_run.head_sha }}
          path: preview-artifact
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  # Only this job receives the non-production Cloudflare token. It checks out main, never the PR,
  # and treats every downloaded artifact byte as hostile until provenance verification. It deploys
  # the PR's SELF-CONTAINED preview in place: stable pr-N-* resources (persistent across pushes),
  # the Worker publicly reachable at its stable workers.dev hostname, gated by the derived per-PR
  # bearer (HMAC of PREVIEW_BEARER_SEED — never moved through logs or artifacts).
  provision:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview-control
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      url: ${{ steps.provision.outputs.url }}
      artifact_digest: ${{ steps.provision.outputs.artifact_digest }}
      schema_digest: ${{ steps.provision.outputs.schema_digest }}
    steps:
      - name: Check out trusted default-branch control code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trusted/hub/package-lock.json
      - name: Install pinned trusted toolchain only
        run: npm --prefix trusted/hub ci --ignore-scripts --no-audit --no-fund
      - name: Download artifact from this trusted workflow run
        uses: actions/download-artifact@v4
        with:
          name: preview-${{ github.run_id }}-${{ needs.build.outputs.head_sha }}
          path: preview-artifact
      - name: Provision, migrate, and deploy the self-contained preview
        id: provision
        env:
          CLOUDFLARE_PREVIEW_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PREVIEW_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_BEARER_SEED: ${{ secrets.PREVIEW_BEARER_SEED }}
        run: >-
          node trusted/infra/cf/preview-control.mjs provision
          --artifact preview-artifact
          --repository "$GITHUB_REPOSITORY"
          --pr "${{ needs.build.outputs.pr }}"
          --head-sha "${{ needs.build.outputs.head_sha }}"
          --source-run-id "${{ github.event.workflow_run.id }}"
          --run-id "$GITHUB_RUN_ID"
          --workflow-ref "$GITHUB_WORKFLOW_REF"
          --account-id "$CLOUDFLARE_PREVIEW_ACCOUNT_ID"
          --wrangler trusted/hub/node_modules/wrangler/bin/wrangler.js
          --migrations-cli trusted/hub/scripts/migrations.mjs
          --github-output "$GITHUB_OUTPUT"

  # Smoke needs no Cloudflare token: it derives the same per-PR bearer from the seed and talks to
  # the preview over plain HTTPS, exactly like an agent or the owner's browser would.
  smoke:
    needs: [build, provision]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview-control
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted smoke code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trusted/hub/package-lock.json
      - name: Install trusted browser dependencies
        run: npm --prefix trusted/hub ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx --prefix trusted/hub playwright install --with-deps chromium
      - name: Verify diagnostics and the bearer gate
        env:
          PREVIEW_BEARER_SEED: ${{ secrets.PREVIEW_BEARER_SEED }}
        run: >-
          node trusted/infra/cf/preview-control.mjs smoke
          --repository "$GITHUB_REPOSITORY"
          --pr "${{ needs.build.outputs.pr }}"
          --head-sha "${{ needs.build.outputs.head_sha }}"
          --artifact-digest "${{ needs.provision.outputs.artifact_digest }}"
          --schema-digest "${{ needs.provision.outputs.schema_digest }}"
      - name: Seed deterministic fixtures through the collector upload path
        env:
          PREVIEW_BEARER_SEED: ${{ secrets.PREVIEW_BEARER_SEED }}
        run: >-
          node trusted/infra/cf/preview-control.mjs seed
          --repository "$GITHUB_REPOSITORY"
          --pr "${{ needs.build.outputs.pr }}"
      - name: Run synthetic remote browser smoke
        env:
          BASE_URL: ${{ needs.provision.outputs.url }}
          PREVIEW_BEARER_SEED: ${{ secrets.PREVIEW_BEARER_SEED }}
        run: npm --prefix trusted/hub run test:e2e
